services:
  mysql:
    image: mysql:8.4
    container_name: openers-dashboard-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: openers_dashboard
      MYSQL_USER: openers
      MYSQL_PASSWORD: openers_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uopeners", "-popeners_password"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  mysql-data:
