name: CI

on:
  pull_request:
  push:
    branches-ignore:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: openers_dashboard
          MYSQL_USER: openers
          MYSQL_PASSWORD: openers_password
          MYSQL_ROOT_PASSWORD: root_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uopeners -popeners_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      DATABASE_URL: mysql://openers:openers_password@127.0.0.1:3306/openers_dashboard
      SESSION_SECRET: ci-only-session-secret-at-least-32-characters
      APP_URL: http://localhost:3000
      EMAIL_PROVIDER: console
      EMAIL_FROM_NAME: DialExpert
      EMAIL_FROM_ADDRESS: no-reply@updates.dialexpert.com
      EMAIL_REPLY_TO: ""
      INVITATION_TTL_HOURS: "48"
      PASSWORD_RESET_TTL_MINUTES: "30"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run db:generate
      - run: git diff --exit-code -- drizzle
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: npm run db:health
      - run: npm run test
      - run: npm run build
