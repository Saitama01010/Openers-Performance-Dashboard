name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: openers_dashboard_test
          MYSQL_USER: openers
          MYSQL_PASSWORD: openers_password
          MYSQL_ROOT_PASSWORD: root_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uopeners -popeners_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      DATABASE_URL: mysql://openers:openers_password@127.0.0.1:3306/openers_dashboard_test
      TEST_DATABASE_URL: mysql://openers:openers_password@127.0.0.1:3306/openers_dashboard_integration_test
      ALLOW_INTEGRATION_TEST_DATABASE: "true"
      DATABASE_ENVIRONMENT: test
      DEPLOYMENT_ENVIRONMENT: test
      SESSION_SECRET: ci-only-session-secret-at-least-32-characters
      APP_URL: http://localhost:3000
      EMAIL_PROVIDER: console
      EMAIL_FROM_NAME: DialExpert
      EMAIL_FROM_ADDRESS: no-reply@updates.dialexpert.com
      EMAIL_REPLY_TO: ""
      INVITATION_TTL_HOURS: "48"
      PASSWORD_RESET_TTL_MINUTES: "30"
      TRUSTED_PROXY_HEADERS: "false"
      ALLOW_DESTRUCTIVE_DEMO_SEED: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Generate disposable CI security secrets
        shell: bash
        run: |
          node -e "const {randomBytes}=require('node:crypto');const fs=require('node:fs');fs.appendFileSync(process.env.GITHUB_ENV,'TEMP_PASSWORD_ENCRYPTION_KEY='+randomBytes(32).toString('base64')+'\nOUTBOX_ENCRYPTION_KEY='+randomBytes(32).toString('base64')+'\nDEMO_SEED_PASSWORD=CI-'+randomBytes(24).toString('base64url')+'!42\n')"
      - run: npm ci
      - run: npm run security:audit
      - name: Allow triggers in the disposable test database
        run: >-
          node -e "const mysql=require('mysql2/promise');(async()=>{const connection=await mysql.createConnection({host:'127.0.0.1',user:'root',password:'root_password'});await connection.query('SET GLOBAL log_bin_trust_function_creators = 1');await connection.end()})().catch((error)=>{console.error(error);process.exit(1)})"
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run db:generate
      - run: git diff --exit-code -- drizzle
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: npm run db:health
      - run: mysql -h 127.0.0.1 -uroot -proot_password -e "CREATE DATABASE IF NOT EXISTS openers_dashboard_integration_test; GRANT ALL PRIVILEGES ON openers_dashboard_integration_test.* TO 'openers'@'%'; FLUSH PRIVILEGES;"
      - run: NODE_ENV=test npm run db:migrate:test
      - name: Verify upgrade from the pre-hardening schema
        env:
          NODE_ENV: test
          DATABASE_ENVIRONMENT: test
          ALLOW_UPGRADE_MIGRATION_TEST: "true"
          UPGRADE_TEST_DATABASE_URL: mysql://openers:openers_password@127.0.0.1:3306/openers_dashboard_upgrade_test
        run: |
          mysql -h 127.0.0.1 -uroot -proot_password -e "CREATE DATABASE IF NOT EXISTS openers_dashboard_upgrade_test; GRANT ALL PRIVILEGES ON openers_dashboard_upgrade_test.* TO 'openers'@'%'; FLUSH PRIVILEGES;"
          npm run db:migrate:upgrade-test
      - run: npm run test
      - run: npm run worker:imports -- --once
      - run: npm run worker:email -- --once
      - run: npm run cleanup:retention
      - run: npm run build
